<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- One dumbbell arm from the center outward -->
    <g id="dumbbell-arm">
      <!-- Handle Bar -->
      <rect x="-4.5" y="-62" width="9" height="44" rx="2" fill="#FFFFFF" />
      
      <!-- Inner Stop Collar -->
      <rect x="-8" y="-44" width="16" height="5" rx="2" fill="#FFFFFF" />
      
      <!-- Main Large Weight Plate -->
      <rect x="-14" y="-55" width="28" height="8" rx="2.5" fill="#FFFFFF" />
      
      <!-- Secondary Weight Plate -->
      <rect x="-11" y="-65" width="22" height="7" rx="2" fill="#FFFFFF" />
      
      <!-- End Cap / Barbell Nut -->
      <rect x="-6" y="-71" width="12" height="4" rx="1.5" fill="#FFFFFF" />
    </g>
  </defs>

  <!-- Background Brand Orange Circle -->
  <circle cx="100" cy="100" r="92" fill="#F97316" />

  <!-- Center-grouped crossed dumbbells -->
  <g transform="translate(100, 100)">
    <!-- 4 Arms forming the 2 crossed dumbbells at 45 degree angles -->
    <use href="#dumbbell-arm" transform="rotate(45)" />
    <use href="#dumbbell-arm" transform="rotate(135)" />
    <use href="#dumbbell-arm" transform="rotate(225)" />
    <use href="#dumbbell-arm" transform="rotate(315)" />

    <!-- Center Hub Ring (matches Kazim Abbas emblem) -->
    <circle cx="0" cy="0" r="17" fill="#F97316" stroke="#FFFFFF" stroke-width="6" />
    
    <!-- Center Dot -->
    <circle cx="0" cy="0" r="5.5" fill="#FFFFFF" />
  </g>
</svg>
