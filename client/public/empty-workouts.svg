<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%" fill="none">
  <!-- Subtle background glow circle -->
  <circle cx="160" cy="120" r="88" fill="#FFF7ED" />
  <circle cx="160" cy="120" r="68" fill="#FFEDD5" opacity="0.6" />

  <!-- Ground shadow / base -->
  <ellipse cx="160" cy="188" rx="72" ry="7" fill="#E2E8F0" />
  <ellipse cx="160" cy="188" rx="48" ry="4" fill="#CBD5E1" opacity="0.7" />

  <!-- Dumbbell Plate Left (Back/Shadowed) -->
  <rect x="94" y="100" width="14" height="68" rx="4" fill="#334155" />
  <rect x="82" y="112" width="10" height="44" rx="3" fill="#1E293B" />

  <!-- Dumbbell Handle (Center bar with grip texture) -->
  <rect x="108" y="130" width="104" height="8" rx="4" fill="#94A3B8" />
  <rect x="144" y="129" width="32" height="10" rx="2" fill="#64748B" />
  <!-- Grip knurling lines -->
  <line x1="150" y1="130" x2="150" y2="138" stroke="#475569" stroke-width="1.5" />
  <line x1="155" y1="130" x2="155" y2="138" stroke="#475569" stroke-width="1.5" />
  <line x1="160" y1="130" x2="160" y2="138" stroke="#475569" stroke-width="1.5" />
  <line x1="165" y1="130" x2="165" y2="138" stroke="#475569" stroke-width="1.5" />
  <line x1="170" y1="130" x2="170" y2="138" stroke="#475569" stroke-width="1.5" />

  <!-- Dumbbell Plate Right (Back/Shadowed) -->
  <rect x="212" y="100" width="14" height="68" rx="4" fill="#334155" />
  <rect x="228" y="112" width="10" height="44" rx="3" fill="#1E293B" />

  <!-- Brand Accent Weight Plates (GymTrack Vibrant Orange) -->
  <rect x="98" y="94" width="8" height="80" rx="3" fill="#F97316" />
  <rect x="214" y="94" width="8" height="80" rx="3" fill="#F97316" />
  <rect x="100" y="98" width="3" height="72" rx="1.5" fill="#FDBA74" opacity="0.8" />
  <rect x="216" y="98" width="3" height="72" rx="1.5" fill="#FDBA74" opacity="0.8" />

  <!-- Motivational Sparkle / Energy Accents -->
  <!-- Sparkle 1 (Top Right) -->
  <path d="M 238 68 Q 248 68 248 58 Q 248 68 258 68 Q 248 68 248 78 Q 248 68 238 68 Z" fill="#F97316" />
  <!-- Sparkle 2 (Top Left Small) -->
  <path d="M 78 82 Q 84 82 84 76 Q 84 82 90 82 Q 84 82 84 88 Q 84 82 78 82 Z" fill="#FBBF24" />
  <!-- Energy ring dots -->
  <circle cx="235" cy="85" r="2.5" fill="#F97316" opacity="0.6" />
  <circle cx="86" cy="98" r="2" fill="#F97316" opacity="0.5" />

  <!-- Little Clipboard / Log Badge on the side -->
  <g transform="translate(182, 134)">
    <rect x="0" y="0" width="34" height="44" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="10" y="-3" width="14" height="6" rx="2" fill="#0F172A" />
    <!-- Checkmark lines -->
    <line x1="8" y1="12" x2="26" y2="12" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="18" x2="26" y2="18" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" />
    <line x1="8" y1="24" x2="20" y2="24" stroke="#F97316" stroke-width="2" stroke-linecap="round" />
    <!-- Mini checkmark -->
    <path d="M 12 32 L 15 35 L 22 28" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

